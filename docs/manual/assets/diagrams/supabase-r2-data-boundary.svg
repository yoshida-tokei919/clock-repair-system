<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">SupabaseとR2のデータ保存境界</title>
  <desc id="desc">中央のRailway上のNext.jsから、業務データの正本であるSupabase PostgreSQL、PDF用Supabase Storage、Inquiry画像用R2、RepairとPublicCase写真用R2への保存先を示す。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <style>
      .bg{fill:#f8fafc}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}
      .title{font:700 28px sans-serif;fill:#0f172a}.label{font:700 18px sans-serif;fill:#0f172a}
      .body{font:15px sans-serif;fill:#334155}.small{font:14px sans-serif;fill:#475569}
      .app{fill:#e0f2fe;stroke:#0284c7;stroke-width:2}.db{fill:#dcfce7;stroke:#16a34a;stroke-width:2}
      .pdf{fill:#ecfdf5;stroke:#059669;stroke-width:2}.r2{fill:#ffedd5;stroke:#ea580c;stroke-width:2}
      .note{fill:#f1f5f9;stroke:#94a3b8;stroke-width:1.5}
    </style>
  </defs>
  <rect class="bg" width="1000" height="680"/>
  <text class="title" x="42" y="49">データ正本とobject bodyの境界</text>
  <rect class="app" x="345" y="88" width="310" height="140" rx="16"/>
  <text class="label" x="500" y="124" text-anchor="middle">Next.js / Railway</text>
  <text class="body" x="500" y="153" text-anchor="middle">server側の業務処理</text>
  <text class="body" x="500" y="178" text-anchor="middle">Prisma・Storage・R2 client</text>
  <rect class="note" x="310" y="245" width="380" height="44" rx="8"/>
  <text class="small" x="500" y="273" text-anchor="middle">管理画面認証: NextAuth + Admin table（Supabase Authではない）</text>
  <path class="line" d="M400 228 L250 340"/>
  <path class="line" d="M460 228 L460 340"/>
  <path class="line" d="M560 228 L760 340"/>
  <path class="line" d="M655 195 L982 195 L982 560 L965 560"/>
  <rect class="db" x="35" y="345" width="300" height="188" rx="15"/>
  <text class="label" x="185" y="381" text-anchor="middle">Supabase PostgreSQL</text>
  <text class="body" x="185" y="414" text-anchor="middle">Prisma経由の業務DB正本</text>
  <text class="body" x="185" y="447" text-anchor="middle">InquiryFile / RepairPhoto等</text>
  <text class="body" x="185" y="472" text-anchor="middle">metadata・object key</text>
  <text class="small" x="185" y="497" text-anchor="middle">InquiryFile: uploadStatus</text>
  <rect class="pdf" x="355" y="345" width="260" height="188" rx="15"/>
  <text class="label" x="485" y="381" text-anchor="middle">Supabase Storage</text>
  <text class="body" x="485" y="414" text-anchor="middle">documents bucket</text>
  <text class="body" x="485" y="447" text-anchor="middle">見積PDF・請求書PDF</text>
  <text class="body" x="485" y="472" text-anchor="middle">binary body</text>
  <rect class="r2" x="650" y="345" width="315" height="130" rx="15"/>
  <text class="label" x="807" y="381" text-anchor="middle">Cloudflare R2</text>
  <text class="body" x="807" y="413" text-anchor="middle">Inquiry画像専用経路</text>
  <text class="body" x="807" y="438" text-anchor="middle">binary body</text>
  <rect class="r2" x="650" y="495" width="315" height="130" rx="15"/>
  <text class="label" x="807" y="531" text-anchor="middle">Cloudflare R2</text>
  <text class="body" x="807" y="563" text-anchor="middle">Repair / PublicCase写真経路</text>
  <text class="body" x="807" y="588" text-anchor="middle">binary body</text>
  <text class="small" x="42" y="637">DBには関連情報とobject key、InquiryFileにはuploadStatusを置く。</text>
  <text class="small" x="42" y="658">Inquiry画像とRepair写真はcredential / bucket設定を分離。</text>
</svg>
