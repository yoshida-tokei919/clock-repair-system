<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1330" role="img" aria-labelledby="title desc">
  <title id="title">LINE Manager senderと履歴照合</title>
  <desc id="desc">UI承認でOutboxを作り、local senderがclaimとfenceを経てlineoaでPOSTを試み、Manager履歴照合後にOUTBOUND正本を作る。POST_UNCONFIRMEDの全体送信停止も示す。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#456078"/></marker>
    <style>text{font-family:"Noto Sans JP","Yu Gothic",sans-serif;fill:#183047}.head{font-size:26px;font-weight:700}.label{font-size:20px;font-weight:700}.sub{font-size:15px}.small{font-size:14px}.line{stroke:#456078;stroke-width:3;fill:none;marker-end:url(#arrow)}.op{fill:#e9f5ff;stroke:#387eb2;stroke-width:2}.auto{fill:#e8f7ed;stroke:#3e9162;stroke-width:2}.store{fill:#f0edfc;stroke:#7765ad;stroke-width:2}.warn{fill:#fff3dc;stroke:#bd8230;stroke-width:2}</style>
  </defs>
  <rect width="840" height="1330" fill="#fff"/>
  <text x="42" y="55" class="head">LINE Manager Outbox → 履歴照合</text>
  <rect x="42" y="75" width="756" height="48" rx="9" fill="#f5f7fa"/>
  <rect x="60" y="89" width="18" height="18" class="op"/><text x="85" y="104" class="small">人の操作</text>
  <rect x="232" y="89" width="18" height="18" class="auto"/><text x="257" y="104" class="small">自動処理</text>
  <rect x="408" y="89" width="18" height="18" class="store"/><text x="433" y="104" class="small">保存データ</text>
  <rect x="585" y="89" width="18" height="18" class="warn"/><text x="610" y="104" class="small">結果未確定</text>
  <rect x="130" y="150" width="580" height="71" rx="13" class="op"/>
  <text x="420" y="180" text-anchor="middle" class="label">UIで文面を明示承認</text>
  <text x="420" y="205" text-anchor="middle" class="sub">ここではLINEへ送らない</text>
  <path d="M420 222 V250" class="line"/>
  <rect x="130" y="253" width="580" height="80" rx="13" class="store"/>
  <text x="420" y="286" text-anchor="middle" class="label">APPROVED outbox intent</text>
  <text x="420" y="312" text-anchor="middle" class="sub">文面・sendId・bot/chat snapshotを固定</text>
  <path d="M420 334 V362" class="line"/>
  <rect x="130" y="365" width="580" height="74" rx="13" class="auto"/>
  <text x="420" y="397" text-anchor="middle" class="label">local senderがclaim</text>
  <text x="420" y="422" text-anchor="middle" class="sub">CLAIMED / 送信前履歴と証拠を保存</text>
  <path d="M420 440 V468" class="line"/>
  <rect x="130" y="471" width="580" height="75" rx="13" class="auto"/>
  <text x="420" y="503" text-anchor="middle" class="label">durable fence</text>
  <text x="420" y="528" text-anchor="middle" class="sub">POST許可より先にDBへ状態を記録</text>
  <path d="M420 547 V575" class="line"/>
  <rect x="130" y="578" width="580" height="104" rx="13" class="warn"/>
  <text x="420" y="613" text-anchor="middle" class="label">POST_UNCONFIRMED</text>
  <text x="420" y="640" text-anchor="middle" class="sub">fence後・POST前停止も含む。送信結果は未確定</text>
  <text x="420" y="663" text-anchor="middle" class="small">手動再送しない</text>
  <path d="M420 683 V797" class="line"/>
  <rect x="130" y="800" width="580" height="74" rx="13" class="auto"/>
  <text x="420" y="832" text-anchor="middle" class="label">lineoa private textV2 POST attempt</text>
  <text x="420" y="857" text-anchor="middle" class="sub">Manager通常トーク / version-coupled 7.7.18</text>
  <path d="M420 875 V903" class="line"/>
  <rect x="130" y="906" width="580" height="81" rx="13" class="auto"/>
  <text x="420" y="938" text-anchor="middle" class="label">Manager履歴reconciliation</text>
  <text x="420" y="964" text-anchor="middle" class="sub">宛先・文面・sendIdまたは有界windowを照合</text>
  <path d="M420 988 V1016" class="line"/>
  <rect x="130" y="1019" width="580" height="72" rx="13" class="store"/>
  <text x="420" y="1051" text-anchor="middle" class="label">CONFIRMED</text>
  <text x="420" y="1076" text-anchor="middle" class="sub">実Manager message IDとtimestampを検証</text>
  <path d="M420 1092 V1120" class="line"/>
  <rect x="130" y="1123" width="580" height="75" rx="13" class="store"/>
  <text x="420" y="1155" text-anchor="middle" class="label">OUTBOUND InquiryMessage</text>
  <text x="420" y="1180" text-anchor="middle" class="sub">履歴確認時に初めて正本を作る</text>
  <rect x="130" y="1216" width="580" height="68" rx="13" class="warn"/>
  <text x="420" y="1244" text-anchor="middle" class="label">global unresolved-post guard</text>
  <text x="420" y="1269" text-anchor="middle" class="sub">未確定が1件でもあれば新たなclaim・fenceを停止</text>
  <text x="420" y="1313" text-anchor="middle" class="sub">n8nはこのLINE送信経路に参加しない</text>
</svg>
